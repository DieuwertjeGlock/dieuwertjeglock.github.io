<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Planeet Aarde</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <main class="hero">

        <div class="planet-wrapper">
            <div class="planet">
                <div class="planet-glow"></div>
                <div class="planet-surface"></div>
                <div class="planet-ring"></div>
            </div>
        </div>

        <div class="content">

            <div class="badge">
                <span class="status-dot"></span>
                ONLINE • 2026
            </div>

            <h1>
                Welcome to
                <span>Planeet Aarde</span>
            </h1>

            <p class="subtitle">
                A small digital world somewhere between
                Earth and the future.
            </p>

            <a
                class="contact"
                href="mailto:contact@planeetaarde.com"
            >
                <span>Contact me</span>
                <span class="arrow">→</span>
            </a>

            <div class="email">
                contact@planeetaarde.com
            </div>

        </div>

    </main>

    <div class="grid"></div>

    <footer>
        © <span id="year"></span> planeetaarde.com
    </footer>

    <script src="script.js"></script>
</body>
</html>
